name: Docker build, test and release

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'docker-release' || format('docker-ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/junpakugenso/blrec

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and validate version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          version=$(python3 scripts/release_version.py --tag "$RELEASE_TAG")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the actual runtime image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
            --tag "blrec:test-$ARCH" .
      - name: Test installed gift decoder and release behavior
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "linux/$ARCH" --entrypoint python \
            -v "$PWD/tests:/tests:ro" -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/src/blrec/__init__.py:/src/blrec/__init__.py:ro" \
            -e PYTHONPATH=/ "blrec:test-$ARCH" -m unittest discover -s /tests -v
      - name: Start container and verify API, webpage and persistence
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/docker_smoke.py "blrec:test-$ARCH" "$VERSION" --platform "linux/$ARCH"
      - name: Export tested image, never rebuild during publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "blrec:test-$ARCH" -o image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: image-${{ matrix.arch }}
          path: image.tar
          retention-days: 3
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/release_version.py --tag "$RELEASE_TAG")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CANDIDATE=candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested candidates and assemble both platforms
        run: |
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch/image.tar"
            docker tag "blrec:test-$arch" "$IMAGE:$CANDIDATE-$arch"
            docker push "$IMAGE:$CANDIDATE-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$CANDIDATE" \
            "$IMAGE:$CANDIDATE-amd64" "$IMAGE:$CANDIDATE-arm64"
          docker buildx imagetools inspect "$IMAGE:$CANDIDATE" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
      - name: Verify PUBLIC pulls and actual startup before touching release tags
        run: |
          docker logout ghcr.io
          # No saved authentication: a private package MUST fail this gate.
          export DOCKER_CONFIG=$(mktemp -d)
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$CANDIDATE"
            python3 scripts/docker_smoke.py "$IMAGE:$CANDIDATE" "$VERSION" --platform "linux/$arch"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse overwriting an existing release and promote tested candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token=$(curl --fail --silent --show-error -u "$GITHUB_ACTOR:$GH_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:junpakugenso/blrec:pull' | jq -er .token)
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/junpakugenso/blrec/manifests/$VERSION")
          if [ "$status" != 404 ]; then
            echo "Refusing to publish $VERSION: registry returned $status (200 means version already exists)."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$CANDIDATE"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
      - name: Verify final public tags and record digests
        run: |
          docker logout ghcr.io
          export DOCKER_CONFIG=$(mktemp -d)
          docker manifest inspect "$IMAGE:$VERSION" > version-index.json
          docker manifest inspect "$IMAGE:latest" > latest-index.json
          cmp version-index.json latest-index.json
          jq -e '[.manifests[].platform.architecture] | sort == ["amd64", "arm64"]' version-index.json
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$VERSION"
            python3 scripts/docker_smoke.py "$IMAGE:$VERSION" "$VERSION" --platform "linux/$arch"
          done
          echo "## Published $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          docker manifest inspect --verbose "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
